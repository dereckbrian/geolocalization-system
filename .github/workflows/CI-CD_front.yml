name: Geolocalization System CI/CD Front-end

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  compile:
    runs-on: ubuntu-lasted
    name: Compile project

    defaults:
      run:
        working-directory: front-end/project-for-ejcGeolocalization

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node and cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install dependecies
        run: npm ci

      - name: compile project
        run: npm run build

  test:
    runs-on: ubuntu-lasted
    name: Teste app

    defaults:
      run:
        working-directory: front-end/project-for-ejcGeolocalization

    steps:
      - name: Checkout code
        uses: action/checkout@v4

      - name: Setup node and cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: install dependecies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    name: build-app

    needs:
      - compile
      - test

    defaults:
      run:
         working-directory: front-end/project-for-ejcGeolocalization

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node and cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install dependecies
        run: npm ci

      - name: Build project
        run: npm run build 



      
      
    