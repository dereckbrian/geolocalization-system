name: Geolocalization System CI/CD Front-end

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  compile:
    runs-on: ubuntu-latest
    name: Compile project front

    defaults:
      run:
        working-directory: front-end/project-for-ejcGeolocalization

    steps:
      - name: Checkout code front
        uses: actions/checkout@v4

      - name: Setup Node and cache front
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front-end/project-for-ejcGeolocalization/package-lock.json

      - name: install dependecies
        run: npm ci

      - name: compile project front
        run: npm run build

  test:
    runs-on: ubuntu-latest
    name: Teste app

    defaults:
      run:
        working-directory: front-end/project-for-ejcGeolocalization

    steps:
      - name: Checkout code front
        uses: actions/checkout@v4

      - name: Setup Node and cache front
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front-end/project-for-ejcGeolocalization/package-lock.json
      
      - name: install dependecies front
        run: npm ci

      - name: Run tests front
        run: npm test

  build:
    runs-on: ubuntu-latest
    name: build-app front

    needs:
      - compile
      - test

    defaults:
      run:
         working-directory: front-end/project-for-ejcGeolocalization

    steps:
      - name: Checkout code front
        uses: actions/checkout@v4

      - name: Setup Node and cache front
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front-end/project-for-ejcGeolocalization/package-lock.json

      - name: install dependecies front
        run: npm ci

      - name: Build project front
        run: npm run build 



      
      
    