name: Geolocalization System CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  compile:
    runs-on: ubuntu-latest
    name: Compile project

    defaults:
      run:
        working-directory: back-end/SistemaDeGeolocalizacaoEJC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Compile project
        run: ./mvnw clean compile


  test:
    runs-on: ubuntu-latest
    name: Test app

    defaults:
      run:
        working-directory: back-end/SistemaDeGeolocalizacaoEJC

    services:
      postgres:
        image: postgis/postgis:15-3.3

        env:
          POSTGRES_DB: sistemaGeolocalizacaoEJC
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d sistemaGeolocalizacaoEJC"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sistemaGeolocalizacaoEJC
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: test_password
      OSRM_URL: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: back-end/SistemaDeGeolocalizacaoEJC/target/surefire-reports


  build:
    runs-on: ubuntu-latest
    name: Build app

    needs:
      - compile
      - test

    defaults:
      run:
        working-directory: back-end/SistemaDeGeolocalizacaoEJC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Build project
        run: ./mvnw clean package -DskipTests


  build-docker-image:
    runs-on: ubuntu-latest
    name: Build and push Docker image

    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./back-end/SistemaDeGeolocalizacaoEJC
          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/geolocalization-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/geolocalization-backend:latest

          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/geolocalization-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/geolocalization-backend:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    name: Deploy app
    needs: build-docker-image

    steps:
      - name: Deploying to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail-with-body --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"